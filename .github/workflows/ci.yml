name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group docs
      - run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html

  base-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dependencies: current
            constraints: ""
          - dependencies: minimum
            # Older ArviZ needs matplotlib.style.core; retain a compatible release.
            constraints: "pymc==5.20.0 arviz==0.20.0 xarray==2024.10.0 matplotlib<3.10"
    name: base package (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv build --wheel
      - name: Install wheel without optional extras
        env:
          DEPENDENCY_CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          uv venv --python 3.11 "${RUNNER_TEMP}/base-venv"
          uv pip install --python "${RUNNER_TEMP}/base-venv/bin/python" dist/*.whl pytest ${DEPENDENCY_CONSTRAINTS}
      - name: Test the installed base package
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/base-venv/bin/python" -m pytest --import-mode=importlib \
            "${GITHUB_WORKSPACE}/tests/test_package.py" \
            "${GITHUB_WORKSPACE}/tests/test_data.py" \
            "${GITHUB_WORKSPACE}/tests/test_metrics.py" \
            "${GITHUB_WORKSPACE}/tests/test_alignment.py"

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pymc_forecast
          key: bart-od-v1
      - run: uv sync --all-extras --group notebooks
      - name: Execute example notebooks (reduced settings)
        env:
          PYMC_FORECAST_SMOKE_TEST: "1"
        run: |
          for nb in docs/examples/*.ipynb; do
            echo "::group::$nb"
            uv run jupyter nbconvert --to notebook --execute --output-dir "${RUNNER_TEMP}/executed" "$nb"
            echo "::endgroup::"
          done
